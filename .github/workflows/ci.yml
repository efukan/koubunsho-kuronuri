# Build, test and the forbidden-API check on every push to main and every pull request.
# (CI downloads the PDFium NuGet package; the application itself never uses the network.)
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - name: Forbidden-API check
        shell: pwsh
        run: ./tools/check-forbidden.ps1
      - name: Build
        run: dotnet build Kuronuri.sln -c Release --nologo
      - name: Test
        run: dotnet test Kuronuri.sln -c Release --no-build --nologo
